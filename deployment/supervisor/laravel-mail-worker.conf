; NOTE: Adjust the path below to match your deployment root if it differs from /var/www.
;       The working directory should be the Laravel project root (where artisan lives).
[program:laravel-mail-worker]
command=php /var/www/artisan queue:work --queue=mail --tries=3 --timeout=90 --sleep=3 --max-jobs=500 --max-time=3600
directory=/var/www
autostart=true
autorestart=true
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-mail-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=120
