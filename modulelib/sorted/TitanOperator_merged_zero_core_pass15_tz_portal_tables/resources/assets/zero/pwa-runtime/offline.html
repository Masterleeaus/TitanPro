<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Titan Runtime Offline</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;color:#e5e7eb;margin:0;display:grid;place-items:center;min-height:100vh;padding:24px}
    .panel{max-width:560px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:28px}
    h1{margin:0 0 8px;font-size:28px}.muted{color:#cbd5e1;line-height:1.7}
  </style>
</head>
<body>
  <div class="panel">
    <h1>Titan runtime is offline</h1>
    <p class="muted">The device shell is cached. Local work can continue, and queued signals can be replayed when the connection returns.</p>
  </div>
</body>
</html>
