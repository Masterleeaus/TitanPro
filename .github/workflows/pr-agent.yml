name: 🤖 Copilot — PR Reviewer

on:
  schedule:
    - cron: '0 * * * *'   # every hour on the hour
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Specific PR number (blank = all open PRs)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: copilot-pr-reviewer
  cancel-in-progress: false

jobs:
  review-prs:
    name: Request Copilot review on open pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch open PRs
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.pr_number }}" ]; then
            echo "[${{ github.event.inputs.pr_number }}]" > /tmp/pr_numbers.json
          else
            gh pr list \
              --repo "${{ github.repository }}" \
              --state open \
              --limit 50 \
              --json number,reviewRequests \
              --jq '[.[] | select(
                      .reviewRequests | map(.login // .name) |
                      contains(["copilot"]) | not
                    ) | .number]' > /tmp/pr_numbers.json
          fi

          COUNT=$(python3 -c "import sys,json; print(len(json.load(open('/tmp/pr_numbers.json'))))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT PR(s) without Copilot review."
          cat /tmp/pr_numbers.json

      - name: Skip if no PRs
        if: steps.prs.outputs.count == '0'
        run: echo "No open PRs needing Copilot review."

      - name: Request Copilot review on each PR
        if: steps.prs.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          PR_NUMS=$(python3 -c "import json; print(' '.join(map(str, json.load(open('/tmp/pr_numbers.json')))))")

          for PR_NUM in $PR_NUMS; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Requesting Copilot review on PR #$PR_NUM"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            TITLE=$(gh pr view "$PR_NUM" --repo "$REPO" --json title --jq '.title')
            echo "  Title: $TITLE"

            # Request Copilot as reviewer
            if gh pr edit "$PR_NUM" --repo "$REPO" \
                --add-reviewer "copilot" 2>/dev/null; then
              echo "  ✓ Copilot review requested on PR #$PR_NUM"
            else
              # Fallback via API
              gh api "repos/$REPO/pulls/$PR_NUM/requested_reviewers" \
                --method POST \
                -f "reviewers[]=copilot" || true
              echo "  ✓ Copilot review requested (via API) on PR #$PR_NUM"
            fi

            echo "Finished PR #$PR_NUM"
          done
