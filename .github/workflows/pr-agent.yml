name: 🤖 Copilot — PR Auto-Merger

on:
  schedule:
    - cron: '0 * * * *'   # every hour on the hour
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Specific PR number (blank = all open Copilot PRs)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: copilot-pr-merger
  cancel-in-progress: false

jobs:
  merge-copilot-prs:
    name: Undraft and merge open Copilot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Fetch open Copilot PRs
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.pr_number }}" ]; then
            echo "[${{ github.event.inputs.pr_number }}]" > /tmp/pr_numbers.json
          else
            # All open PRs authored by Copilot (draft or ready)
            gh pr list \
              --repo "${{ github.repository }}" \
              --state open \
              --limit 50 \
              --json number,author,isDraft,mergeable,mergeStateStatus \
              --jq '[.[] | select(.author.login == "Copilot") | .number]' \
              > /tmp/pr_numbers.json
          fi

          COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/pr_numbers.json'))))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT Copilot PR(s) to process."
          cat /tmp/pr_numbers.json

      - name: Skip if no PRs
        if: steps.prs.outputs.count == '0'
        run: echo "No open Copilot PRs."

      - name: Undraft and merge each Copilot PR
        if: steps.prs.outputs.count != '0'
        env:
          # GH_PAT is used for the merge step so it can bypass branch protection
          # via --admin. If GH_PAT is not set it falls back to GITHUB_TOKEN, but
          # --admin bypass will then only work if the Actions bot has admin rights.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          PR_NUMS=$(python3 -c "import json; print(' '.join(map(str, json.load(open('/tmp/pr_numbers.json')))))")

          for PR_NUM in $PR_NUMS; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Processing Copilot PR #$PR_NUM"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            PR_DATA=$(gh pr view "$PR_NUM" --repo "$REPO" \
              --json title,isDraft,mergeable,mergeStateStatus,headRefName)

            TITLE=$(echo "$PR_DATA"     | python3 -c "import sys,json; print(json.load(sys.stdin)['title'])")
            IS_DRAFT=$(echo "$PR_DATA"  | python3 -c "import sys,json; print(json.load(sys.stdin)['isDraft'])")
            MERGEABLE=$(echo "$PR_DATA" | python3 -c "import sys,json; print(json.load(sys.stdin)['mergeable'])")
            STATUS=$(echo "$PR_DATA"    | python3 -c "import sys,json; print(json.load(sys.stdin)['mergeStateStatus'])")

            echo "  Title:     $TITLE"
            echo "  Draft:     $IS_DRAFT"
            echo "  Mergeable: $MERGEABLE ($STATUS)"

            # Skip conflicting PRs
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "  ⚠️  PR #$PR_NUM has conflicts — skipping. Needs manual resolution."
              gh pr comment "$PR_NUM" --repo "$REPO" \
                --body "⚠️ **Merge conflict detected.** This PR cannot be auto-merged. Please resolve the conflicts and push to the branch." 2>/dev/null || true
              continue
            fi

            # Step 1: Undraft if needed
            if [ "$IS_DRAFT" = "True" ]; then
              echo "  Marking PR #$PR_NUM ready for review..."
              gh pr ready "$PR_NUM" --repo "$REPO" || true
              sleep 8   # give GitHub time to recalculate merge status after undraft
            fi

            # Step 2: Merge with --admin to bypass branch protection rules.
            # We do NOT attempt gh pr review --approve because:
            #   a) GITHUB_TOKEN cannot approve PRs if branch protection requires
            #      reviews from humans or code owners.
            #   b) A self-approval attempt blocks rather than helps auto-merge.
            # --admin overrides required-reviews and required-status-check gates.
            if gh pr merge "$PR_NUM" --repo "$REPO" --squash --admin --delete-branch 2>/dev/null; then
              echo "  ✓ PR #$PR_NUM merged (admin bypass, branch deleted)"
            elif gh pr merge "$PR_NUM" --repo "$REPO" --squash --auto --delete-branch 2>/dev/null; then
              echo "  ✓ PR #$PR_NUM queued for auto-merge (will merge when checks pass)"
            else
              echo "  ✗ PR #$PR_NUM could not be merged — status: $STATUS"
              gh pr comment "$PR_NUM" --repo "$REPO" \
                --body "⚠️ **Auto-merge failed** (merge state: \`$STATUS\`). This PR may be waiting on required status checks or branch protection rules that cannot be bypassed without admin rights. It will be retried next hour." \
                2>/dev/null || true
            fi

            sleep 3
          done
