name: Portable Shell Paths

on:
  pull_request:
    branches: [main, master, production]
    paths:
      - "scripts/agent-issue-runner.sh"
      - "scripts/fix-filament-view.sh"
      - "scripts/check-portable-paths.mjs"
      - ".github/workflows/portable-shell-paths.yml"
  push:
    branches: [main, master, production]
    paths:
      - "scripts/agent-issue-runner.sh"
      - "scripts/fix-filament-view.sh"
      - "scripts/check-portable-paths.mjs"
      - ".github/workflows/portable-shell-paths.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check repository-relative shell paths
        run: node scripts/check-portable-paths.mjs
