name: ⚡ Fast PR Validation

on:
  pull_request:
    branches: [main, master, production]
  push:
    branches: [main, master, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-fast-checks:
    name: frontend:lint-typecheck-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm run test

  backend-unit-tests:
    name: backend:unit-feature
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, bcmath, json
          coverage: none

      - name: Copy .env for CI
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Run backend unit and feature tests
        run: composer run test --no-interaction
