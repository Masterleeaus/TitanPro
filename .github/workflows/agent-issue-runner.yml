name: 🤖 Copilot — Issue Assigner

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
    # ── Batch size guide ────────────────────────────────────────────────────
    # GitHub Copilot Pro+ coding agent handles the actual implementation.
    # This workflow only assigns issues — no Anthropic API needed.
    # Batch of 5 is conservative; raise to 10-20 if Copilot keeps up.
    # ────────────────────────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Specific issue number (blank = batch of oldest open)'
        required: false
        type: string
      batch_size:
        description: 'Issues to assign per run (default 5)'
        required: false
        default: '5'
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: copilot-issue-assigner
  cancel-in-progress: false

jobs:
  assign-issues:
    name: Assign ${{ github.event.inputs.batch_size || '5' }} issues to Copilot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ensure agent labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ENTRY in \
            "agent-assigned|0075ca|Issue currently being worked on by an agent" \
            "agent-completed|0e8a16|Agent successfully resolved this issue" \
            "agent-failed|d93f0b|Agent encountered an error on this issue"; do
            NAME=$(echo "$ENTRY"  | cut -d'|' -f1)
            COLOR=$(echo "$ENTRY" | cut -d'|' -f2)
            DESC=$(echo "$ENTRY"  | cut -d'|' -f3)
            gh api "repos/${{ github.repository }}/labels" \
              --method POST \
              -f name="$NAME" -f color="$COLOR" -f description="$DESC" \
              2>/dev/null || true   # silently skip if label already exists
          done

      - name: Select issues to assign
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BATCH="${{ github.event.inputs.batch_size || '5' }}"

          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            echo "${{ github.event.inputs.issue_number }}" > /tmp/issue_numbers.txt
          else
            # Pick N oldest open issues without agent labels
            gh issue list \
              --repo "${{ github.repository }}" \
              --state open \
              --limit 200 \
              --json number,createdAt,labels \
              --jq "[.[] | select(.labels | map(.name) |
                    (contains([\"agent-assigned\"]) or
                     contains([\"agent-completed\"]) or
                     contains([\"agent-failed\"])) | not)]
                   | sort_by(.createdAt) | .[:${BATCH}] | .[].number" \
              > /tmp/issue_numbers.txt
          fi

          COUNT=$(wc -l < /tmp/issue_numbers.txt | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Selected $COUNT issue(s) to assign:"
          cat /tmp/issue_numbers.txt

          if [ "$COUNT" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no eligible issues
        if: steps.pick.outputs.skip == 'true'
        run: echo "No eligible open issues. All issues are assigned or completed."

      - name: Assign each issue to GitHub Copilot
        if: steps.pick.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          while IFS= read -r ISSUE_NUM; do
            [ -z "$ISSUE_NUM" ] && continue

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Assigning issue #$ISSUE_NUM to GitHub Copilot"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            TITLE=$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json title --jq '.title')
            echo "  Title: $TITLE"

            # Assign Copilot as coding agent
            if gh issue edit "$ISSUE_NUM" --repo "$REPO" \
                --add-assignee "copilot" \
                --add-label "agent-assigned" 2>/dev/null; then
              echo "  ✓ Copilot assigned to issue #$ISSUE_NUM"
            else
              # Fallback: assign via API (handles orgs where @copilot syntax differs)
              gh api "repos/$REPO/issues/$ISSUE_NUM/assignees" \
                --method POST \
                -f "assignees[]=copilot" || true
              gh issue edit "$ISSUE_NUM" --repo "$REPO" \
                --add-label "agent-assigned" || true
              echo "  ✓ Copilot assigned (via API) to issue #$ISSUE_NUM"
            fi

            # Post a comment with full Copilot instructions (including issue-docs requirement)
            # Build body via echo to avoid unindented lines that would break YAML parsing
            BODY_FILE=$(mktemp)
            {
              echo "🤖 **GitHub Copilot** has been assigned to this issue."
              echo ""
              echo "## Instructions for Copilot"
              echo ""
              echo "Please implement the fix described above, then **before committing**:"
              echo ""
              echo "1. Create the file \`issue-docs/issue-${ISSUE_NUM}.md\` with exactly these sections:"
              echo ""
              printf '```markdown\n'
              echo "## Issue Summary"
              echo "<one paragraph describing the problem>"
              echo ""
              echo "## Root Cause"
              echo "<what was causing the bug or what was missing>"
              echo ""
              echo "## Changes Made"
              echo "<list every file modified with key before/after lines>"
              echo ""
              echo "## Tests Added or Updated"
              echo "<list any new or changed test cases>"
              echo ""
              echo "## Next Steps"
              echo "<follow-on work, known gaps, related issues, or 'None' if complete>"
              printf '```\n'
              echo ""
              echo "2. Commit **all** changes (code + \`issue-docs/issue-${ISSUE_NUM}.md\`) together."
              echo "3. Open a pull request targeting \`main\`."
              echo ""
              echo "> The \`issue-docs\` file is required — an automated agent reads the **Next Steps** section after merge to create follow-up issues. PRs missing this file will be flagged."
            } > "$BODY_FILE"
            gh issue comment "$ISSUE_NUM" --repo "$REPO" \
              --body-file "$BODY_FILE" || true
            rm -f "$BODY_FILE"

          done < /tmp/issue_numbers.txt

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Batch complete."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
