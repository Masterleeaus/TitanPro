name: 🤖 Copilot — Issue Assigner

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Specific issue number (blank = batch of oldest open)'
        required: false
        type: string
      batch_size:
        description: 'Issues to assign per run (default 10)'
        required: false
        default: '10'
        type: string

# models: read  — required for Copilot coding agent API
# pull-requests: write — required for Copilot to create PRs
# issues: write — label / comment management
permissions:
  contents: read
  issues: write
  models: read
  pull-requests: write

concurrency:
  group: copilot-issue-assigner
  cancel-in-progress: false

jobs:
  assign-issues:
    name: Assign ${{ github.event.inputs.batch_size || '10' }} issues to Copilot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ensure agent labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ENTRY in \
            "agent-assigned|0075ca|Issue currently being worked on by Copilot" \
            "agent-completed|0e8a16|Copilot successfully resolved this issue" \
            "agent-failed|d93f0b|Copilot encountered an error on this issue"; do
            NAME=$(echo "$ENTRY"  | cut -d'|' -f1)
            COLOR=$(echo "$ENTRY" | cut -d'|' -f2)
            DESC=$(echo "$ENTRY"  | cut -d'|' -f3)
            gh api "repos/${{ github.repository }}/labels" \
              --method POST \
              -f name="$NAME" -f color="$COLOR" -f description="$DESC" \
              2>/dev/null || true
          done

      - name: Select issues to assign
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BATCH="${{ github.event.inputs.batch_size || '10' }}"

          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            echo "${{ github.event.inputs.issue_number }}" > /tmp/issue_numbers.txt
          else
            gh issue list \
              --repo "${{ github.repository }}" \
              --state open \
              --limit 200 \
              --json number,createdAt,labels \
              --jq "[.[] | select(.labels | map(.name) |
                    (contains([\"agent-assigned\"] ) or
                     contains([\"agent-completed\"]) or
                     contains([\"agent-failed\"])) | not)]
                   | sort_by(.createdAt) | .[:${BATCH}] | .[].number" \
              > /tmp/issue_numbers.txt
          fi

          COUNT=$(wc -l < /tmp/issue_numbers.txt | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Selected $COUNT issue(s) to assign:"
          cat /tmp/issue_numbers.txt
          [ "$COUNT" -eq 0 ] && echo "skip=true" >> "$GITHUB_OUTPUT" || echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Skip if no eligible issues
        if: steps.pick.outputs.skip == 'true'
        run: echo "No eligible open issues. All issues are assigned or completed."

      - name: Trigger Copilot coding agent on each issue
        if: steps.pick.outputs.skip != 'true'
        env:
          # GH_PAT must be a Personal Access Token with scopes:
          #   repo, issues, pull_requests, copilot
          # Set it as a repository/org secret named GH_PAT.
          # GITHUB_TOKEN does NOT have the 'copilot' scope and will always
          # return 403 on the Copilot coding agent API — that is why the
          # schedule was silently doing nothing before this fix.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          while IFS= read -r ISSUE_NUM; do
            [ -z "$ISSUE_NUM" ] && continue

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            TITLE=$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json title --jq '.title')
            echo "  Assigning Copilot coding agent to issue #$ISSUE_NUM: $TITLE"

            # Trigger Copilot coding agent via the REST API.
            # Errors are printed to the log (NOT silenced) so failures are visible.
            API_RESPONSE=$(gh api "repos/$REPO/issues/$ISSUE_NUM/copilot" \
              --method POST \
              -f base_ref="main" 2>&1)
            API_EXIT=$?

            if [ $API_EXIT -eq 0 ]; then
              echo "  ✓ Copilot coding agent triggered for issue #$ISSUE_NUM"

              # Only mark assigned + post instructions when the API actually succeeded
              gh issue edit "$ISSUE_NUM" --repo "$REPO" \
                --add-label "agent-assigned" 2>/dev/null || true

              BODY_FILE=$(mktemp)
              {
                echo "🤖 **GitHub Copilot coding agent** has been assigned to this issue."
                echo ""
                echo "## Instructions for Copilot"
                echo ""
                echo "Please implement the fix described above, then **before committing**:"
                echo ""
                echo "1. Create the file \`issue-docs/issue-${ISSUE_NUM}.md\` with exactly these sections:"
                echo ""
                printf '```markdown\n'
                echo "## Issue Summary"
                echo "<one paragraph describing the problem>"
                echo ""
                echo "## Root Cause"
                echo "<what was causing the bug or what was missing>"
                echo ""
                echo "## Changes Made"
                echo "<list every file modified with key before/after lines>"
                echo ""
                echo "## Tests Added or Updated"
                echo "<list any new or changed test cases>"
                echo ""
                echo "## Next Steps"
                echo "<follow-on work, known gaps, related issues, or 'None' if complete>"
                printf '```\n'
                echo ""
                echo "2. Commit **all** changes (code + \`issue-docs/issue-${ISSUE_NUM}.md\`) together."
                echo "3. Open a pull request targeting \`main\`."
                echo ""
                echo "> The \`issue-docs\` file is required — an automated agent reads the **Next Steps** section after merge to create follow-up issues."
              } > "$BODY_FILE"
              gh issue comment "$ISSUE_NUM" --repo "$REPO" --body-file "$BODY_FILE" || true
              rm -f "$BODY_FILE"

            else
              # API failed — mark as agent-failed so it can be investigated.
              # It will NOT be retried automatically (agent-failed label excludes it).
              echo "  ✗ Copilot API failed for #$ISSUE_NUM (exit $API_EXIT)"
              echo "  API response: $API_RESPONSE"
              echo ""
              echo "  Possible causes:"
              echo "    • GH_PAT secret is missing or lacks 'copilot' scope"
              echo "    • Copilot coding agent not enabled in repository settings"
              echo "    • GitHub API rate limit reached"

              gh issue edit "$ISSUE_NUM" --repo "$REPO" \
                --add-label "agent-failed" 2>/dev/null || true
              gh issue comment "$ISSUE_NUM" --repo "$REPO" \
                --body "⚠️ **Copilot coding agent could not be triggered** (workflow exit code: ${API_EXIT}). The \`agent-failed\` label has been applied. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the API error detail. Common fix: add a \`GH_PAT\` repository secret with \`repo\`, \`issues\`, \`pull_requests\`, and \`copilot\` scopes." \
                2>/dev/null || true
            fi

            sleep 2
          done < /tmp/issue_numbers.txt

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Batch complete."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
