name: 🤖 Agent Issue Runner

on:
  schedule:
    # Runs every 5 minutes — GitHub Actions minimum interval
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Specific issue number to process (leave blank for oldest open)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # Only one agent run at a time — prevents two agents racing on the same issue
  group: agent-issue-runner
  cancel-in-progress: false

jobs:
  run-agent:
    name: Assign agent to oldest open issue
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout on the working branch ────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/scan-repo-for-bugs-NPTj0
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 2. Git identity for agent commits ────────────────────────────────
      - name: Configure git identity
        run: |
          git config user.name  "Titan Agent"
          git config user.email "agent@titanpro.app"

      # ── 3. Pick the issue to work on ─────────────────────────────────────
      - name: Select issue
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            NUM="${{ github.event.inputs.issue_number }}"
          else
            # Oldest open issue without the agent-assigned or agent-completed label
            NUM=$(gh issue list \
              --repo "${{ github.repository }}" \
              --state open \
              --limit 200 \
              --json number,createdAt,labels \
              --jq '[.[] | select(.labels | map(.name) | (contains(["agent-assigned"]) or contains(["agent-completed"]) or contains(["agent-failed"])) | not)] | sort_by(.createdAt) | .[0].number')
          fi

          if [ -z "$NUM" ] || [ "$NUM" = "null" ]; then
            echo "No eligible open issues found. Exiting."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # Fetch full issue data
          gh issue view "$NUM" \
            --repo "${{ github.repository }}" \
            --json number,title,body,labels \
            > /tmp/issue.json

          echo "Issue #$NUM selected."
          cat /tmp/issue.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['title'])"

      # ── 4. Guard: skip if no issue found ─────────────────────────────────
      - name: Skip if no issue
        if: steps.pick.outputs.skip == 'true'
        run: echo "No open unassigned issues. Workflow complete." && exit 0

      # ── 5. Mark issue as agent-assigned ──────────────────────────────────
      - name: Label issue as agent-assigned
        if: steps.pick.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ steps.pick.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "agent-assigned" || true

      # ── 6. Setup PHP + Composer ───────────────────────────────────────────
      - name: Setup PHP 8.2
        if: steps.pick.outputs.skip != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, xml, curl, zip
          coverage: none

      - name: Install Composer dependencies
        if: steps.pick.outputs.skip != 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      # ── 7. Setup Node + npm ───────────────────────────────────────────────
      - name: Setup Node.js
        if: steps.pick.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        if: steps.pick.outputs.skip != 'true'
        run: npm ci --prefer-offline

      # ── 8. Install Claude Code CLI ────────────────────────────────────────
      - name: Install Claude Code CLI
        if: steps.pick.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code

      # ── 9. Prepare issue-docs folder ─────────────────────────────────────
      - name: Ensure issue-docs directory exists
        if: steps.pick.outputs.skip != 'true'
        run: mkdir -p issue-docs

      # ── 10. Run Claude agent ──────────────────────────────────────────────
      - name: Run Claude agent on issue
        if: steps.pick.outputs.skip != 'true'
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM="${{ steps.pick.outputs.number }}"
          ISSUE_DATA=$(cat /tmp/issue.json)

          claude --dangerously-skip-permissions -p "
          You are a senior software engineering agent working on the TitanPro Laravel 12 + Vue 3 + Filament repository.

          You have been assigned to resolve GitHub issue #${ISSUE_NUM}.

          ISSUE DATA:
          ${ISSUE_DATA}

          MANDATORY INSTRUCTIONS — follow all of these exactly:

          1. Read and fully understand the issue before making any changes.
          2. Explore all relevant code files to understand the current state.
          3. Implement the complete fix, improvement, or feature described in the issue.
          4. REQUIRED: Create the file issue-docs/issue-${ISSUE_NUM}.md containing:
             - ## Issue Summary (what the issue was)
             - ## Root Cause (why it existed)
             - ## Changes Made (each file changed with before/after for key lines)
             - ## Tests Added or Updated
             - ## Next Steps (any follow-on work needed, limitations, or related issues)
          5. Commit ALL changes (code + issue-docs/issue-${ISSUE_NUM}.md) with the message:
             'fix: resolve issue #${ISSUE_NUM} — <short description>'
          6. Push commits to branch: claude/scan-repo-for-bugs-NPTj0

          CONSTRAINTS:
          - Do NOT push to main or master.
          - Do NOT create a pull request unless the issue explicitly asks for one.
          - Do NOT modify unrelated files.
          - If the issue cannot be implemented safely, document why in the issue-docs file and exit cleanly.

          STACK CONTEXT:
          - Laravel 12, PHP 8.2+, Filament v3, Vue 3, TypeScript, Inertia.js, Tailwind CSS v4
          - Tests: Pest (in-memory SQLite), run with: ./vendor/bin/pest
          - Linting: vendor/bin/pint (PHP), npm run lint (JS/TS)
          - Working branch: claude/scan-repo-for-bugs-NPTj0
          "

      # ── 11. Label outcome ─────────────────────────────────────────────────
      - name: Label issue as agent-completed
        if: steps.pick.outputs.skip != 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ steps.pick.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "agent-completed" \
            --remove-label "agent-assigned" || true

          gh issue comment "${{ steps.pick.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --body "🤖 **Agent completed.** Changes committed to \`claude/scan-repo-for-bugs-NPTj0\`. See [\`issue-docs/issue-${{ steps.pick.outputs.number }}.md\`](../blob/claude/scan-repo-for-bugs-NPTj0/issue-docs/issue-${{ steps.pick.outputs.number }}.md) for a full summary of changes and next steps." || true

      - name: Label issue as agent-failed
        if: steps.pick.outputs.skip != 'true' && failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ steps.pick.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "agent-failed" \
            --remove-label "agent-assigned" || true

          gh issue comment "${{ steps.pick.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --body "🤖 **Agent run failed** on this issue. It will be retried on the next cycle. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." || true
