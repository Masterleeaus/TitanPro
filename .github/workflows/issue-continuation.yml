name: 🤖 Copilot — Issue Continuation

on:
  schedule:
    - cron: '30 * * * *'   # every hour at :30 (offset from PR reviewer)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-continuation
  cancel-in-progress: false

jobs:
  continue-issues:
    name: Create follow-up issues from issue-docs next steps
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: claude/scan-repo-for-bugs-NPTj0
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Check for issue-docs files
        id: check
        run: |
          COUNT=$(find issue-docs -name 'issue-*.md' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT issue-doc files."

      - name: Skip if no docs
        if: steps.check.outputs.count == '0'
        run: echo "No issue-docs files yet. Nothing to continue."

      # ── Minimal Claude call: extract + deduplicate next steps only ──────────
      # This is the only step that uses the Anthropic API. It reads the
      # ## Next Steps sections from all issue-docs and filters out items that
      # are already tracked as open issues, then creates new GitHub issues.
      # Everything else (actual coding) is handled by GitHub Copilot agents.
      # ────────────────────────────────────────────────────────────────────────
      - name: Install Claude Code CLI (minimal use)
        if: steps.check.outputs.count != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Build issue-docs summary
        if: steps.check.outputs.count != '0'
        run: |
          echo "# Issue Docs Summary" > /tmp/issue_docs_summary.md
          for f in issue-docs/issue-*.md; do
            ISSUE_NUM=$(basename "$f" .md | sed 's/issue-//')
            echo "" >> /tmp/issue_docs_summary.md
            echo "---" >> /tmp/issue_docs_summary.md
            echo "## Source: $f (issue #$ISSUE_NUM)" >> /tmp/issue_docs_summary.md
            cat "$f" >> /tmp/issue_docs_summary.md
          done

      - name: Fetch existing open issues (titles only)
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --limit 200 \
            --json number,title \
            --jq '[.[] | "#\(.number): \(.title)"] | join("\n")' \
            > /tmp/existing_issues.txt
          echo "Existing open issues:"
          cat /tmp/existing_issues.txt

      - name: Create follow-up issues (Claude deduplication only)
        if: steps.check.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          REPO:              ${{ github.repository }}
        run: |
          DOCS=$(cat /tmp/issue_docs_summary.md)
          EXISTING=$(cat /tmp/existing_issues.txt)

          claude --dangerously-skip-permissions -p "
          You are a project manager reading completed issue documentation.
          Your ONLY job: extract next steps and create GitHub issues for ones not already tracked.
          Do NOT write any code. Do NOT modify any files.

          COMPLETED ISSUE DOCS:
          ${DOCS}

          CURRENTLY OPEN ISSUES (do NOT duplicate):
          ${EXISTING}

          INSTRUCTIONS:
          1. Read every '## Next Steps' section in the docs above.
          2. For each next step, check if a similar issue already exists. Use fuzzy matching.
          3. For each GENUINELY NEW next step not already tracked, run:
             gh issue create \
               --repo ${REPO} \
               --title '[FOLLOW-UP] <concise title>' \
               --label 'enhancement' \
               --body '<description including: what, why, source issue, acceptance criteria checklist>

          Source: Follows from issue-docs/issue-N.md

          **Acceptance criteria:**
          - [ ] ...

          > When an agent works this issue it must create issue-docs/issue-{N}.md listing all files changed, fixes applied, and next steps before committing.'
          4. Print a summary: docs scanned, next steps found, issues created, items skipped.

          Be conservative — only create clearly actionable, non-duplicate issues."
