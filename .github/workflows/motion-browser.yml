name: 🌐 Motion Browser Validation

on:
  push:
    branches: [main, master]
    paths:
      - 'Modules/TitanNexus/UI/**'
      - 'tests/Browser/**'
      - 'resources/views/ui-studio/**'
      - 'app/Http/Controllers/UiStudio/**'
      - '.github/workflows/motion-browser.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Modules/TitanNexus/UI/**'
      - 'tests/Browser/**'
      - 'resources/views/ui-studio/**'
      - 'app/Http/Controllers/UiStudio/**'
      - '.github/workflows/motion-browser.yml'
  workflow_dispatch:
    inputs:
      regenerate_baselines:
        description: 'Regenerate snapshot baselines (overwrites stored PNGs)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: motion-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motion-browser:
    name: UI Studio Motion — Browser Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, bcmath, json, gd
          coverage: none

      - name: Copy .env for CI
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Install ChromeDriver
        run: php artisan dusk:chrome-driver --detect

      - name: Start Chrome in headless mode
        run: |
          google-chrome --headless=new --disable-gpu --remote-debugging-port=9222 &
          sleep 2

      - name: Start Laravel development server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 &
          sleep 3
        env:
          APP_ENV: testing
          APP_URL: http://127.0.0.1:8000

      - name: Run Dusk browser tests (Motion DOM / CSS)
        run: php artisan dusk tests/Browser/MotionBrowserTest.php
        env:
          APP_ENV: testing
          APP_URL: http://127.0.0.1:8000
          DUSK_DRIVER_URL: http://localhost:9515

      - name: Run Dusk snapshot tests (Motion visual regression)
        run: php artisan dusk tests/Browser/MotionPresetSnapshotTest.php
        env:
          APP_ENV: testing
          APP_URL: http://127.0.0.1:8000
          DUSK_DRIVER_URL: http://localhost:9515
          # Configurable pixel-diff threshold (default 1 %).
          # Set to a higher value (e.g. 0.03) to allow minor rendering differences.
          MOTION_SNAPSHOT_THRESHOLD: '0.01'
          # Set to 'true' via workflow_dispatch to regenerate all baseline PNGs.
          MOTION_REGENERATE_BASELINES: ${{ inputs.regenerate_baselines || 'false' }}

      - name: Upload Dusk failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-motion-failures
          path: tests/Browser/screenshots
          retention-days: 7

      - name: Collect snapshot diff artifacts
        if: failure()
        # Bundle the captured screenshots alongside the stored baselines so
        # reviewers can visually inspect what changed.
        run: |
          mkdir -p /tmp/motion-snapshot-diffs
          # Copy current baseline PNGs
          cp tests/Browser/Snapshots/motion-presets/*.png /tmp/motion-snapshot-diffs/ 2>/dev/null || true
          # Copy the screenshots just captured (named motion-snapshot-<preset>.png)
          for f in tests/Browser/screenshots/motion-snapshot-*.png; do
            [ -f "$f" ] && cp "$f" /tmp/motion-snapshot-diffs/ || true
          done

      - name: Upload snapshot diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-motion-snapshot-diffs
          path: /tmp/motion-snapshot-diffs
          retention-days: 14
