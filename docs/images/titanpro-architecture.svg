<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">Titan Pro Business Operations Console architecture</title><desc id="desc">A modular Laravel and Vue operations console connects domain modules to Laravel and Filament, Inertia and Vue, then web, mobile, and PWA surfaces.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10241f"/><stop offset="1" stop-color="#187d6e"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#96f0bf"/></marker><style>.e{font:700 13px Segoe UI,Arial;letter-spacing:2px;fill:#96f0bf}.t{font:700 32px Segoe UI,Arial;fill:#f5fff9}.s{font:400 15px Segoe UI,Arial;fill:#d8f5e6}.n{fill:#1c5b54;stroke:#4da892;stroke-width:2}.g{fill:#28786c;stroke:#96f0bf;stroke-width:2}.y{fill:#60412f;stroke:#f6a77f;stroke-width:2}.l{font:700 16px Segoe UI,Arial;fill:#fff}.b{font:400 13px Segoe UI,Arial;fill:#d3eee0}.q{font:400 12px Segoe UI,Arial;fill:#b9d9cb}.r{stroke:#96f0bf;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="26" fill="url(#bg)"/><text x="64" y="58" class="e">TITAN PRO � MODULAR OPERATIONS MAP</text><text x="64" y="106" class="t">One business platform, multiple operational surfaces</text><text x="64" y="136" class="s">Source-backed from app/, Modules/, Mobile/, PWA/, Web/, composer.json, and package scripts.</text><rect x="70" y="220" width="270" height="130" rx="16" class="n"/><text x="205" y="260" text-anchor="middle" class="l">Business modules</text><text x="205" y="290" text-anchor="middle" class="b">CRM � dispatch � finance</text><text x="205" y="318" text-anchor="middle" class="q">booking � payroll � supply chain</text><path d="M340 285H450" class="r"/><rect x="450" y="220" width="270" height="130" rx="16" class="g"/><text x="585" y="260" text-anchor="middle" class="l">Laravel + Filament</text><text x="585" y="290" text-anchor="middle" class="b">backend + admin</text><text x="585" y="318" text-anchor="middle" class="q">routes � modules � policies</text><path d="M720 285H830" class="r"/><rect x="830" y="220" width="270" height="130" rx="16" class="g"/><text x="965" y="260" text-anchor="middle" class="l">Inertia + Vue</text><text x="965" y="290" text-anchor="middle" class="b">web interaction layer</text><text x="965" y="318" text-anchor="middle" class="q">Vite + Tailwind tooling</text><path d="M1100 285H1210" class="r"/><rect x="1210" y="220" width="220" height="130" rx="16" class="y"/><text x="1320" y="260" text-anchor="middle" class="l">Surfaces</text><text x="1320" y="290" text-anchor="middle" class="b">Web � Mobile � PWA</text><text x="1320" y="318" text-anchor="middle" class="q">relationship under review</text><rect x="450" y="520" width="650" height="92" rx="16" class="n"/><text x="775" y="557" text-anchor="middle" class="l">Evidence boundary</text><text x="775" y="584" text-anchor="middle" class="q">portfolio landing page does not claim current build or production readiness</text></svg>

